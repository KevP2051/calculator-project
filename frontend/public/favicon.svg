  <rect x="236" y="200" width="552" height="186" rx="52" fill="#2B2B2D"/>
  <rect x="676" y="240" width="74" height="106" rx="37" fill="none" stroke="#FFFFFF" stroke-width="20"/>

  <g filter="url(#keyLift)" fill="#F6F6F8">
    <rect x="238" y="430" width="248" height="182" rx="54"/>
    <rect x="538" y="430" width="252" height="182" rx="54"/>
    <rect x="238" y="644" width="248" height="182" rx="54"/>
  </g>
  <g filter="url(#keyLift)">
