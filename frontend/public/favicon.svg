    <filter id="bodyLift" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#9A9AA5" flood-opacity="0.35"/>
    </filter>
    <filter id="keyLift" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#9A9AA5" flood-opacity="0.35"/>
