services:
  calculator-service:
    build: ./backend
    environment:
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080/api/v1
    ports:
      - "5173:80"
    depends_on:
      - calculator-service
